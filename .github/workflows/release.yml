# SPDX-License-Identifier: AGPL-3.0-or-later
# Push a tag "vX.Y.Z" matching pyproject.toml's version to publish:
#   - a GitHub Release with the CHANGELOG section, the wheel and the sdist;
#   - the Docker image ghcr.io/<owner>/dgeo:X.Y.Z and :latest.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check that the tag matches the package version
        run: |
          v=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then echo "::error::tag $GITHUB_REF_NAME != version $v"; exit 1; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Test
        run: |
          pip install -e ".[ui,dem,dev]" build
          pytest -q
          dgeo demo --out-dir demo

      - name: Build wheel and sdist
        run: python -m build

      - name: Release notes from CHANGELOG
        run: |
          awk -v v="$VERSION" '/^## /{p = index($0, v) > 0; next} p' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md" > notes.md

      - name: Build and push the Docker image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build -t "$image:$VERSION" -t "$image:latest" .
          docker run --rm "$image:$VERSION" python -m pytest -q tests
          docker push "$image:$VERSION"
          docker push "$image:latest"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "dgeo $VERSION" --notes-file notes.md --verify-tag
