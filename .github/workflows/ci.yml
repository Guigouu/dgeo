name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[ui,dem,dev]"
      - name: Version consistency
        run: python scripts/check_version.py
      - name: Tests
        run: pytest -q
      - name: Synthetic end-to-end demo
        run: dgeo demo --out-dir demo
      - name: UI imports
        run: python -m py_compile app/app.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t dgeo:ci .
      - name: Tests in image
        run: docker run --rm dgeo:ci python -m pytest -q tests
