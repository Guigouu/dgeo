name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Do not attach real recordings, ADS-B captures, `meta.json` files,
        coordinates or timestamps** that could reveal where someone lives or was — including you.
        Reproduce with synthetic data (`dgeo synth --seed N`) whenever possible.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Commands or UI steps, ideally on a synthetic scenario (`dgeo synth --seed …`).
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / traceback
      description: Remove any coordinates, timestamps, callsigns or file names that identify a place or a person.
      render: text
  - type: input
    id: version
    attributes:
      label: dgeo version / commit
      placeholder: "0.1.0 or commit SHA"
    validations:
      required: true
  - type: dropdown
    id: env
    attributes:
      label: Environment
      options: [Docker image, Local install (pip), Other]
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This issue contains no real recording, ADS-B capture, location or timestamp that could identify a person's whereabouts.
          required: true
