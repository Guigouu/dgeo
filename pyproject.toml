[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dgeo"
version = "0.4.0"
description = "Acoustic geolocation from aircraft Doppler curves and ADS-B trajectories (proof of concept)"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "dgeo contributors" }]
keywords = ["doppler", "ads-b", "geolocation", "acoustics", "osint", "spectrogram"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "requests>=2.31",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40", "tzdata"]
dem = ["rasterio>=1.3"]
dev = ["pytest>=8"]

[project.scripts]
dgeo = "dgeo.cli:main"

[project.urls]
Homepage = "https://github.com/Guigouu/dgeo"
Issues = "https://github.com/Guigouu/dgeo/issues"

[tool.setuptools]
packages = ["dgeo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
